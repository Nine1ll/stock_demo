services:
  - type: web
    name: stock-demo
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python web_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_DATA_DIR
        value: data
      - key: ALERT_POLL_SECONDS
        value: "300"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
